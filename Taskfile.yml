version: "3"

vars:
  VERSION: "v0.9.2"

tasks:
  .subconverter_env:
    desc: "Create .subconverter_env placeholder and inform the user"
    cmds:
      - touch .subconverter_env
      - echo "paste your subscription url to .subconverter_env"

  subconverter.exe:
    desc: "Download and extract subconverter"
    platforms: [windows]
    cmds:
      - xh --download "https://github.com/metacubex/subconverter/releases/download/{{.VERSION}}/subconverter_win64.7z"
      - 7z e subconverter_win64.7z subconverter/subconverter.exe
      - rm -f subconverter_win64.7z
    status:
      - test -f subconverter.exe

  merlinclash.yaml:
    desc: "Generate merlinclash.yaml using subconverter"
    platforms: [windows]
    deps:
      - subconverter.exe
    cmds:
      - ./subconverter.exe -g

  merlinclash_deduplicated.yaml:
    desc: "Deduplicate merlinclash rules"
    deps:
      - merlinclash.yaml
    cmds:
      - uv pip install ruamel-yaml==0.18.10
      - uv run scripts/deduplicate_rules.py merlinclash.yaml
      - sed -i '/PROCESS-NAME/d' merlinclash_deduplicated.yaml

  upload_gist:
    desc: "Upload deduplicated merlinclash to a gist"
    deps:
      - merlinclash_deduplicated.yaml
    dotenv:
      # Put Gist ID in the .env file as APP_GIST_ID
      - .env
    preconditions:
      - test -n "$APP_GIST_ID"
    cmds:
      - gh gist edit $APP_GIST_ID -f merlinclash.yaml merlinclash_deduplicated.yaml

  reload_conf:
    desc: "Trigger a reload of MerlinClash on the ASUS router"
    vars:
      # Override on the command line, e.g.: task reload_conf PROFILE=AP_ssp
      PROFILE: '{{.PROFILE | default "AP_ssp"}}'
    dotenv:
      # .env carries ASUS_HOST / ASUS_USER / ASUS_PASS
      - .env
    preconditions:
      - test -n "$ASUS_HOST"
      - test -n "$ASUS_USER"
      - test -n "$ASUS_PASS"
    cmds:
      - node scripts/apply_merlinclash.js {{.PROFILE}}

  clean:
    desc: "Remove generated files"
    cmds:
      - rm -f subconverter.exe
      - rm -f merlinclash.yaml
      - rm -f merlinclash_deduplicated.yaml
